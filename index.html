<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1E1E1E" />
    <!-- El sitio YA es oscuro: esto le dice al navegador del teléfono
         (Samsung Internet, Chrome) que NO le aplique su "modo oscuro
         automático" encima — ese modo oscurecía las fotos y cambiaba el
         dorado de los precios a color vino. -->
    <meta name="color-scheme" content="dark" />
    <meta name="supported-color-schemes" content="dark" />
    <meta name="description" content="Mueble Zulia — muebles fabricados en Maracaibo: modulares, comedores, dormitorios y más, en la tela y el color que prefieras." />
    <!-- Tipografía Inter (la que ya pedía el CSS, pero nunca se cargaba) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Mueble Zulia</title>
    <!-- Ícono de la pestaña del navegador (favicon) — el mismo logo de la
         mueblería, en varios tamaños para que se vea nítido en cualquier
         pestaña, marcador o acceso directo. -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  </head>
  <body class="bg-carbon text-ink">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
